<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test PDF Viewer (Blob URL)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a2e; color: #fff; }
    .container { display: flex; gap: 20px; height: 80vh; }
    .sidebar { width: 300px; background: #16213e; border-radius: 8px; padding: 10px; overflow-y: auto; }
    .viewer { flex: 1; background: #0f3460; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .viewer iframe { width: 100%; height: 100%; border: 0; }
    .doc-item { padding: 10px; cursor: pointer; border-radius: 6px; margin-bottom: 6px; background: #1a1a3e; border-left: 4px solid transparent; }
    .doc-item:hover { background: #1a1a5e; }
    .doc-item.selected { background: #2a2a5e; border-left-color: #e94560; }
    .loading { color: #e94560; font-size: 18px; }
    .status { margin-top: 10px; padding: 10px; background: #0d1b2a; border-radius: 6px; font-family: monospace; font-size: 12px; max-height: 120px; overflow-y: auto; }
    h2 { color: #e94560; }
    button { background: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Test: PDF Viewer via Blob URL Proxy</h2>
  <div class="container">
    <div class="sidebar">
      <p>Documentos:</p>
      <div id="docList">Cargando...</div>
    </div>
    <div class="viewer" id="viewer">
      <p id="viewerMsg">Selecciona un documento</p>
    </div>
  </div>
  <div class="status" id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.prepend(line);
      console.log(msg);
    }

    let blobUrl = null;

    async function loadDocs() {
      log('Fetching RPCs from /api/proxy/rpc_all...');
      const resp = await fetch('/api/proxy/rpc_all');
      const json = await resp.json();
      log(`Got ${json.data?.length || 0} RPCs`);

      const rpcsWithDocs = (json.data || []).filter(r => r.documentos_con_enlaces && r.documentos_con_enlaces.length > 0);
      log(`RPCs with documents: ${rpcsWithDocs.length}`);

      const docList = document.getElementById('docList');
      docList.innerHTML = '';

      rpcsWithDocs.forEach(rpc => {
        rpc.documentos_con_enlaces.forEach(doc => {
          const div = document.createElement('div');
          div.className = 'doc-item';
          div.innerHTML = `<strong>${doc.filename}</strong><br><small>${(doc.size / 1024).toFixed(1)} KB - ${doc.content_type}</small>`;
          div.onclick = () => selectDoc(doc, div);
          docList.appendChild(div);
        });
      });
    }

    async function selectDoc(doc, el) {
      // Highlight
      document.querySelectorAll('.doc-item').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');

      const viewer = document.getElementById('viewer');
      viewer.innerHTML = '<p class="loading">Cargando documento...</p>';

      // Revoke previous blob
      if (blobUrl) {
        URL.revokeObjectURL(blobUrl);
        blobUrl = null;
      }

      const remoteUrl = doc.url_visualizar || doc.url_presigned || doc.s3_url;
      log(`Remote URL length: ${remoteUrl.length}`);
      log(`Remote URL start: ${remoteUrl.substring(0, 80)}...`);

      // Encode with btoa the same way as the React component
      const encoded = btoa(unescape(encodeURIComponent(remoteUrl)));
      log(`Base64 length: ${encoded.length}`);

      const proxyUrl = `/api/proxy/fetch-file?url=${encodeURIComponent(encoded)}&name=${encodeURIComponent(doc.filename)}&inline=1`;
      log(`Proxy URL: ${proxyUrl.substring(0, 100)}...`);

      try {
        log('Fetching via proxy...');
        const response = await fetch(proxyUrl);
        log(`Response status: ${response.status}`);
        log(`Response Content-Type: ${response.headers.get('Content-Type')}`);
        log(`Response Content-Disposition: ${response.headers.get('Content-Disposition')}`);

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`HTTP ${response.status}: ${text}`);
        }

        const blob = await response.blob();
        log(`Blob size: ${blob.size}, type: "${blob.type}"`);

        const pdfBlob = blob.type === 'application/pdf' ? blob : new Blob([blob], { type: 'application/pdf' });
        log(`PDF Blob size: ${pdfBlob.size}, type: "${pdfBlob.type}"`);

        blobUrl = URL.createObjectURL(pdfBlob);
        log(`Blob URL: ${blobUrl}`);

        // Method 1: iframe
        viewer.innerHTML = `<iframe src="${blobUrl}" style="width:100%;height:100%;border:0;" title="PDF"></iframe>`;
        log('iframe created with blob URL');

      } catch (err) {
        log(`ERROR: ${err.message}`);
        viewer.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      }
    }

    loadDocs();
  </script>
</body>
</html>
