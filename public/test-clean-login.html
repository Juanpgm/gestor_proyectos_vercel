<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: Limpiar Sesión y Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #64748b;
        }
        
        .btn-danger {
            background: #dc2626;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .status.warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }
        
        .log-container {
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .log-entry {
            padding: 6px;
            margin-bottom: 4px;
            border-left: 3px solid transparent;
            border-radius: 4px;
        }
        
        .log-entry.info {
            border-left-color: #3b82f6;
        }
        
        .log-entry.success {
            border-left-color: #10b981;
        }
        
        .log-entry.error {
            border-left-color: #ef4444;
        }
        
        .timestamp {
            color: #94a3b8;
            margin-right: 10px;
        }
        
        .info-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            color: #475569;
        }
        
        .info-value {
            color: #1e293b;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            text-align: right;
            max-width: 60%;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Limpiar Sesión y Login</h1>
        <p class="subtitle">Este test limpiará la sesión actual y hará un nuevo login para verificar que el token se guarde correctamente</p>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Tu contraseña" required>
        </div>
        
        <button class="btn" onclick="runFullTest()">
            🚀 Limpiar Sesión y Hacer Login
        </button>
        
        <div class="actions">
            <button class="btn btn-secondary" onclick="checkSession()">
                🔍 Ver Sesión Actual
            </button>
            <button class="btn btn-danger" onclick="cleanSession()">
                🗑️ Solo Limpiar Sesión
            </button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div id="sessionInfo" style="display: none;">
            <div class="info-box" id="sessionDetails"></div>
        </div>
        
        <div class="log-container" id="logContainer"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type} show`;
            statusDiv.innerHTML = message;
        }

        function cleanSession() {
            log('🗑️ Limpiando sesión...', 'info');
            
            try {
                // Limpiar localStorage
                const localSession = localStorage.getItem('auth_session');
                if (localSession) {
                    log('Encontrada sesión en localStorage', 'info');
                    localStorage.removeItem('auth_session');
                    log('✅ localStorage limpiado', 'success');
                }
                
                // Limpiar sessionStorage
                const sessionSession = sessionStorage.getItem('auth_session');
                if (sessionSession) {
                    log('Encontrada sesión en sessionStorage', 'info');
                    sessionStorage.removeItem('auth_session');
                    log('✅ sessionStorage limpiado', 'success');
                }
                
                if (!localSession && !sessionSession) {
                    log('⚠️ No se encontró ninguna sesión activa', 'warning');
                }
                
                showStatus('✅ Sesión limpiada exitosamente', 'success');
                document.getElementById('sessionInfo').style.display = 'none';
                
            } catch (error) {
                log(`❌ Error limpiando sesión: ${error.message}`, 'error');
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        function checkSession() {
            log('🔍 Verificando sesión actual...', 'info');
            
            try {
                let session = localStorage.getItem('auth_session') || sessionStorage.getItem('auth_session');
                
                if (!session) {
                    log('❌ No hay sesión activa', 'error');
                    showStatus('⚠️ No hay sesión activa', 'warning');
                    document.getElementById('sessionInfo').style.display = 'none';
                    return null;
                }
                
                const parsed = JSON.parse(session);
                const storageType = localStorage.getItem('auth_session') ? 'localStorage' : 'sessionStorage';
                
                log(`✅ Sesión encontrada en ${storageType}`, 'success');
                log(`Email: ${parsed.user?.email}`, 'info');
                log(`UID: ${parsed.user?.uid}`, 'info');
                log(`Tiene idToken: ${!!parsed.user?.idToken}`, parsed.user?.idToken ? 'success' : 'error');
                log(`Roles: ${parsed.user?.roles?.join(', ') || 'Sin roles'}`, 'info');
                
                const sessionDetailsDiv = document.getElementById('sessionDetails');
                sessionDetailsDiv.innerHTML = `
                    <div class="info-row">
                        <span class="info-label">Storage:</span>
                        <span class="info-value">${storageType}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email:</span>
                        <span class="info-value">${parsed.user?.email || 'N/A'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">UID:</span>
                        <span class="info-value">${parsed.user?.uid || 'N/A'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Tiene idToken:</span>
                        <span class="info-value">${parsed.user?.idToken ? '✅ Sí' : '❌ No'}</span>
                    </div>
                    ${parsed.user?.idToken ? `
                    <div class="info-row">
                        <span class="info-label">idToken (inicio):</span>
                        <span class="info-value">${parsed.user.idToken.substring(0, 30)}...</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Es JWT:</span>
                        <span class="info-value">${parsed.user.idToken.startsWith('eyJ') ? '✅ Sí' : '❌ No'}</span>
                    </div>
                    ` : ''}
                    <div class="info-row">
                        <span class="info-label">Roles:</span>
                        <span class="info-value">${parsed.user?.roles?.join(', ') || 'Sin roles'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Permisos:</span>
                        <span class="info-value">${parsed.user?.permissions?.length || 0} permisos</span>
                    </div>
                `;
                
                document.getElementById('sessionInfo').style.display = 'block';
                
                if (!parsed.user?.idToken) {
                    showStatus('⚠️ Sesión sin token JWT - Es necesario limpiar y volver a hacer login', 'warning');
                } else if (!parsed.user.idToken.startsWith('eyJ')) {
                    showStatus('⚠️ Token inválido - No es un JWT válido', 'error');
                } else {
                    showStatus('✅ Sesión válida con token JWT correcto', 'success');
                }
                
                return parsed;
                
            } catch (error) {
                log(`❌ Error verificando sesión: ${error.message}`, 'error');
                showStatus(`❌ Error: ${error.message}`, 'error');
                return null;
            }
        }

        async function doLogin(email, password) {
            log('🔐 Iniciando login...', 'info');
            log(`Email: ${email}`, 'info');
            
            // Intentar primero con el proxy, si falla usar API directa
            const urls = [
                '/api/proxy/auth/login',
                'https://gestorproyectoapi-production.up.railway.app/auth/login'
            ];
            
            let lastError = null;
            
            for (const url of urls) {
                try {
                    log(`Intentando con: ${url.includes('proxy') ? 'Proxy' : 'API Directa'}`, 'info');
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password })
                    });

                    log(`Status de respuesta: ${response.status}`, 'info');

                    if (!response.ok) {
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            const error = await response.json();
                            throw new Error(error.error || error.message || error.detail || `HTTP ${response.status}`);
                        } else {
                            // Si no es JSON, probablemente sea un 404 HTML
                            log(`⚠️ Respuesta no es JSON, probando siguiente URL...`, 'warning');
                            continue;
                        }
                    }

                    const data = await response.json();
                    
                    log('✅ Login exitoso en API', 'success');
                    log(`Usuario: ${data.user?.email}`, 'info');
                    log(`UID: ${data.user?.uid}`, 'info');
                    
                    // Verificar si el backend retorna el token
                    const idToken = data.id_token || data.idToken || data.token || data.user?.id_token;
                    
                    if (!idToken) {
                        log('⚠️ ADVERTENCIA: Backend no retornó id_token', 'error');
                        log('Campos en la respuesta: ' + Object.keys(data).join(', '), 'info');
                        showStatus('⚠️ El backend no retornó el token. Usando UID como fallback.', 'warning');
                    } else {
                        log(`✅ Token recibido: ${idToken.substring(0, 20)}...`, 'success');
                        log(`Es JWT: ${idToken.startsWith('eyJ') ? 'Sí ✅' : 'No ❌'}`, idToken.startsWith('eyJ') ? 'success' : 'error');
                    }
                    
                    // Simular el mapeo y guardado que hace authService
                    const user = {
                        uid: data.user.uid,
                        email: data.user.email,
                        displayName: data.user.display_name || data.user.name,
                        roles: data.user.roles || data.user.firestore_data?.roles || [],
                        permissions: data.user.permissions || data.user.firestore_data?.permissions || [],
                        idToken: idToken || data.user.uid // Fallback a uid si no hay token
                    };
                    
                    const sessionData = {
                        user,
                        timestamp: Date.now(),
                        remember: true
                    };
                    
                    localStorage.setItem('auth_session', JSON.stringify(sessionData));
                    log('💾 Sesión guardada en localStorage', 'success');
                    log(`idToken guardado: ${!!user.idToken}`, user.idToken ? 'success' : 'error');
                    
                    return user;
                    
                } catch (error) {
                    log(`❌ Error con ${url.includes('proxy') ? 'Proxy' : 'API Directa'}: ${error.message}`, 'warning');
                    lastError = error;
                    // Continuar con la siguiente URL
                }
            }
            
            // Si llegamos aquí, ninguna URL funcionó
            log(`❌ Todas las URLs fallaron`, 'error');
            throw lastError || new Error('No se pudo conectar con el backend');
        }

        async function testApiCall(token) {
            log('🧪 Probando llamada a API con el nuevo token...', 'info');
            
            const urls = [
                '/api/proxy/admin/users?limit=5',
                'https://gestorproyectoapi-production.up.railway.app/admin/users?limit=5'
            ];
            
            let lastError = null;
            
            for (const url of urls) {
                try {
                    log(`Intentando con: ${url.includes('proxy') ? 'Proxy' : 'API Directa'}`, 'info');
                    
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    log(`Status de respuesta: ${response.status}`, 'info');

                    if (!response.ok) {
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            const error = await response.json();
                            throw new Error(error.error || error.message || `HTTP ${response.status}`);
                        } else {
                            log(`⚠️ Respuesta no es JSON, probando siguiente URL...`, 'warning');
                            continue;
                        }
                    }

                    const data = await response.json();
                    const userCount = data.users?.length || data.data?.length || 0;
                    
                    log(`✅ API call exitosa - ${userCount} usuarios obtenidos`, 'success');
                    return true;
                    
                } catch (error) {
                    log(`❌ Error con ${url.includes('proxy') ? 'Proxy' : 'API Directa'}: ${error.message}`, 'warning');
                    lastError = error;
                }
            }
            
            log(`❌ Todas las URLs fallaron`, 'error');
            throw lastError || new Error('No se pudo conectar con el backend');
        }

        async function runFullTest() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                showStatus('❌ Por favor ingresa email y contraseña', 'error');
                return;
            }
            
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Procesando...';
            
            try {
                showStatus('🔄 Iniciando proceso...', 'info');
                
                // Paso 1: Limpiar sesión
                log('═══════════════════════════════════════', 'info');
                log('PASO 1: LIMPIAR SESIÓN', 'info');
                log('═══════════════════════════════════════', 'info');
                cleanSession();
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Paso 2: Hacer login
                log('', 'info');
                log('═══════════════════════════════════════', 'info');
                log('PASO 2: HACER LOGIN', 'info');
                log('═══════════════════════════════════════', 'info');
                const user = await doLogin(email, password);
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Paso 3: Verificar sesión guardada
                log('', 'info');
                log('═══════════════════════════════════════', 'info');
                log('PASO 3: VERIFICAR SESIÓN GUARDADA', 'info');
                log('═══════════════════════════════════════', 'info');
                const session = checkSession();
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Paso 4: Probar API call
                log('', 'info');
                log('═══════════════════════════════════════', 'info');
                log('PASO 4: PROBAR API CALL', 'info');
                log('═══════════════════════════════════════', 'info');
                await testApiCall(user.idToken);
                
                // Resultado final
                log('', 'info');
                log('═══════════════════════════════════════', 'success');
                log('✅ TEST COMPLETADO EXITOSAMENTE', 'success');
                log('═══════════════════════════════════════', 'success');
                
                if (user.idToken && user.idToken.startsWith('eyJ')) {
                    showStatus('✅ ¡Éxito! El token JWT se guardó correctamente. Ya puedes asignar roles.', 'success');
                } else {
                    showStatus('⚠️ Login exitoso pero el backend no retornó un token JWT válido. Contacta al administrador del backend.', 'warning');
                }
                
            } catch (error) {
                log('', 'info');
                log('═══════════════════════════════════════', 'error');
                log('❌ TEST FALLÓ', 'error');
                log('═══════════════════════════════════════', 'error');
                showStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Limpiar Sesión y Hacer Login';
            }
        }
        
        // Log inicial
        window.addEventListener('DOMContentLoaded', () => {
            log('Test de Login con Limpieza de Sesión iniciado', 'info');
            log('Verifica la sesión actual antes de comenzar', 'info');
            
            // Auto-check de sesión al cargar
            const session = localStorage.getItem('auth_session') || sessionStorage.getItem('auth_session');
            if (session) {
                log('⚠️ Hay una sesión activa - Haz click en "Ver Sesión Actual" para verificarla', 'warning');
            } else {
                log('✅ No hay sesión activa', 'info');
            }
        });
    </script>
</body>
</html>
