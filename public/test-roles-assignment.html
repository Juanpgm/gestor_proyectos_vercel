<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Asignación de Roles - Diagnóstico Completo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .status.pending {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .status.warning {
            background: #fed7aa;
            color: #9a3412;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .info-label {
            font-weight: 600;
            color: #475569;
        }
        
        .info-value {
            color: #1e293b;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            max-width: 60%;
            text-align: right;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #64748b;
        }
        
        .btn-danger {
            background: #dc2626;
        }
        
        .log-container {
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .log-entry {
            padding: 8px;
            margin-bottom: 4px;
            border-left: 3px solid transparent;
            border-radius: 4px;
        }
        
        .log-entry.info {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .log-entry.success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .log-entry.error {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        
        .log-entry.warning {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }
        
        .timestamp {
            color: #94a3b8;
            margin-right: 10px;
        }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #f8fafc;
            border-radius: 6px;
        }
        
        .checkbox-item input {
            width: auto;
            margin: 0;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .icon {
            width: 24px;
            height: 24px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .json-viewer {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .test-step {
            padding: 15px;
            background: #f8fafc;
            border-left: 4px solid #cbd5e1;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .test-step.running {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        
        .test-step.passed {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }
        
        .test-step.failed {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }
        
        .test-step-title {
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .test-step-detail {
            font-size: 13px;
            color: #64748b;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                Test de Asignación de Roles
            </h1>
            <p class="subtitle">Diagnóstico completo del flujo de autenticación y asignación de roles</p>
        </div>

        <div class="grid">
            <!-- Estado de Autenticación -->
            <div class="card">
                <h2>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    Estado de Autenticación
                </h2>
                <div id="authStatus"></div>
                <button class="btn btn-secondary" onclick="checkAuthStatus()">🔄 Refrescar Estado</button>
            </div>

            <!-- Token Analysis -->
            <div class="card">
                <h2>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                    Análisis de Token
                </h2>
                <div id="tokenAnalysis"></div>
            </div>

            <!-- Test de API -->
            <div class="card full-width">
                <h2>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                    Tests del Sistema
                </h2>
                <div id="testResults"></div>
                <button class="btn" onclick="runAllTests()">▶️ Ejecutar Todos los Tests</button>
            </div>

            <!-- Asignación de Roles -->
            <div class="card full-width">
                <h2>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    Asignar Roles a Usuario
                </h2>
                
                <label for="userUid">UID del Usuario:</label>
                <input type="text" id="userUid" placeholder="Ej: abc123xyz...">
                
                <label>Roles a Asignar:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="role_super_admin" value="super_admin">
                        <label for="role_super_admin" style="margin: 0;">Super Admin</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="role_gerencia" value="gerencia">
                        <label for="role_gerencia" style="margin: 0;">Gerencia</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="role_responsable" value="responsable">
                        <label for="role_responsable" style="margin: 0;">Responsable</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="role_editor" value="editor">
                        <label for="role_editor" style="margin: 0;">Editor</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="role_visualizador" value="visualizador">
                        <label for="role_visualizador" style="margin: 0;">Visualizador</label>
                    </div>
                </div>
                
                <label for="reason">Razón (opcional):</label>
                <input type="text" id="reason" placeholder="Motivo de la asignación...">
                
                <button class="btn" onclick="assignRoles()">💾 Asignar Roles</button>
                
                <div id="assignmentResult"></div>
            </div>

            <!-- Logs -->
            <div class="card full-width">
                <h2>
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Logs del Sistema
                </h2>
                <button class="btn btn-secondary" onclick="clearLogs()">🗑️ Limpiar Logs</button>
                <div class="log-container" id="logContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // Log system
        const logs = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ timestamp, message, type });
            
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function clearLogs() {
            logs.length = 0;
            document.getElementById('logContainer').innerHTML = '';
            log('Logs limpiados', 'info');
        }
        
        // Get auth session from storage
        function getAuthSession() {
            try {
                const localData = localStorage.getItem('auth_session');
                if (localData) {
                    return JSON.parse(localData);
                }
                
                const sessionData = sessionStorage.getItem('auth_session');
                if (sessionData) {
                    return JSON.parse(sessionData);
                }
                
                return null;
            } catch (error) {
                log(`Error obteniendo sesión: ${error.message}`, 'error');
                return null;
            }
        }
        
        // Get auth token
        function getAuthToken() {
            const session = getAuthSession();
            // Priorizar idToken sobre uid
            return session?.user?.idToken || session?.user?.uid || null;
        }
        
        // Check authentication status
        function checkAuthStatus() {
            log('Verificando estado de autenticación...', 'info');
            
            const session = getAuthSession();
            const authStatusDiv = document.getElementById('authStatus');
            
            if (!session) {
                authStatusDiv.innerHTML = `
                    <div class="status error">
                        <span>❌</span>
                        <span>No Autenticado</span>
                    </div>
                    <p style="color: #dc2626; font-size: 14px; margin-top: 10px;">
                        No se encontró sesión activa. Por favor, inicia sesión primero.
                    </p>
                `;
                log('No hay sesión activa', 'error');
                return;
            }
            
            const user = session.user;
            authStatusDiv.innerHTML = `
                <div class="status success">
                    <span>✅</span>
                    <span>Autenticado</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email:</span>
                    <span class="info-value">${user.email || 'N/A'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">UID:</span>
                    <span class="info-value">${user.uid || 'N/A'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Roles:</span>
                    <span class="info-value">${user.roles?.join(', ') || 'Sin roles'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Permisos:</span>
                    <span class="info-value">${user.permissions?.length || 0} permisos</span>
                </div>
            `;
            
            log(`Usuario autenticado: ${user.email}`, 'success');
            log(`Roles: ${user.roles?.join(', ') || 'Sin roles'}`, 'info');
            
            // Update token analysis
            analyzeToken();
        }
        
        // Analyze token
        function analyzeToken() {
            const token = getAuthToken();
            const tokenAnalysisDiv = document.getElementById('tokenAnalysis');
            
            if (!token) {
                tokenAnalysisDiv.innerHTML = `
                    <div class="status error">
                        <span>❌</span>
                        <span>Sin Token</span>
                    </div>
                    <p style="color: #dc2626; font-size: 14px; margin-top: 10px;">
                        No se encontró token de autenticación.
                    </p>
                `;
                log('No hay token disponible', 'error');
                return;
            }
            
            tokenAnalysisDiv.innerHTML = `
                <div class="status success">
                    <span>✅</span>
                    <span>Token Presente</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Token (UID):</span>
                    <span class="info-value">${token.substring(0, 20)}...</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Longitud:</span>
                    <span class="info-value">${token.length} caracteres</span>
                </div>
            `;
            
            log(`Token encontrado: ${token.substring(0, 20)}...`, 'success');
        }
        
        // Run all tests
        async function runAllTests() {
            const testsDiv = document.getElementById('testResults');
            testsDiv.innerHTML = '<p style="color: #3b82f6;">Ejecutando tests...</p>';
            log('Iniciando batería de tests...', 'info');
            
            const tests = [
                { name: 'Test 1: Verificar Sesión Local', fn: test1_checkSession },
                { name: 'Test 2: Verificar Token', fn: test2_checkToken },
                { name: 'Test 3: Test de Proxy (GET)', fn: test3_proxyGet },
                { name: 'Test 4: Test de Headers', fn: test4_checkHeaders },
                { name: 'Test 5: Listar Usuarios', fn: test5_listUsers },
                { name: 'Test 6: Validar Permisos', fn: test6_checkPermissions },
            ];
            
            let html = '';
            let passed = 0;
            let failed = 0;
            
            for (const test of tests) {
                log(`Ejecutando: ${test.name}`, 'info');
                html += `<div class="test-step running" id="test_${tests.indexOf(test)}">
                    <div class="test-step-title">
                        <span class="spinner"></span>
                        ${test.name}
                    </div>
                    <div class="test-step-detail">Ejecutando...</div>
                </div>`;
                testsDiv.innerHTML = html;
                
                try {
                    const result = await test.fn();
                    passed++;
                    
                    const testDiv = document.getElementById(`test_${tests.indexOf(test)}`);
                    testDiv.className = 'test-step passed';
                    testDiv.innerHTML = `
                        <div class="test-step-title">
                            ✅ ${test.name}
                        </div>
                        <div class="test-step-detail">${result}</div>
                    `;
                    
                    log(`✅ ${test.name}: PASSED`, 'success');
                } catch (error) {
                    failed++;
                    
                    const testDiv = document.getElementById(`test_${tests.indexOf(test)}`);
                    testDiv.className = 'test-step failed';
                    testDiv.innerHTML = `
                        <div class="test-step-title">
                            ❌ ${test.name}
                        </div>
                        <div class="test-step-detail">${error.message}</div>
                    `;
                    
                    log(`❌ ${test.name}: FAILED - ${error.message}`, 'error');
                }
            }
            
            html += `<div class="info-row" style="margin-top: 20px;">
                <span class="info-label">Resultado Final:</span>
                <span class="info-value">${passed} Pasados / ${failed} Fallados</span>
            </div>`;
            
            testsDiv.innerHTML = html;
            log(`Tests completados: ${passed} pasados, ${failed} fallados`, passed === tests.length ? 'success' : 'warning');
        }
        
        // Test 1: Check Session
        async function test1_checkSession() {
            const session = getAuthSession();
            if (!session) throw new Error('No hay sesión activa');
            if (!session.user) throw new Error('Sesión sin datos de usuario');
            if (!session.user.email) throw new Error('Usuario sin email');
            return `Sesión encontrada para ${session.user.email}`;
        }
        
        // Test 2: Check Token
        async function test2_checkToken() {
            const token = getAuthToken();
            if (!token) throw new Error('No hay token disponible');
            if (token.length < 10) throw new Error('Token demasiado corto');
            return `Token válido (${token.length} caracteres)`;
        }
        
        // Test 3: Proxy GET Test
        async function test3_proxyGet() {
            const token = getAuthToken();
            const response = await fetch('/api/proxy/auth/admin/roles', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(`Proxy error: ${response.status} - ${error.message || JSON.stringify(error)}`);
            }
            
            const data = await response.json();
            return `Proxy funcional - Respuesta: ${response.status}`;
        }
        
        // Test 4: Check Headers
        async function test4_checkHeaders() {
            const token = getAuthToken();
            const response = await fetch('/api/proxy/auth/admin/users', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });
            
            // Check if authorization header was sent
            if (!response.ok && response.status === 401) {
                throw new Error('Headers de autorización no aceptados (401)');
            }
            
            if (!response.ok && response.status === 403) {
                throw new Error('Sin permisos suficientes (403)');
            }
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(`Error ${response.status}: ${error.message || JSON.stringify(error)}`);
            }
            
            return 'Headers enviados correctamente';
        }
        
        // Test 5: List Users
        async function test5_listUsers() {
            const token = getAuthToken();
            const response = await fetch('/api/proxy/admin/users', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(`Error listando usuarios: ${response.status} - ${JSON.stringify(error)}`);
            }
            
            const data = await response.json();
            const userCount = data.users?.length || data.data?.length || 0;
            return `${userCount} usuarios encontrados`;
        }
        
        // Test 6: Check Permissions
        async function test6_checkPermissions() {
            const session = getAuthSession();
            const permissions = session?.user?.permissions || [];
            
            if (permissions.length === 0) {
                throw new Error('Usuario sin permisos definidos');
            }
            
            const hasManageUsers = permissions.includes('manage:users');
            if (!hasManageUsers) {
                throw new Error('Usuario sin permiso manage:users necesario para asignar roles');
            }
            
            return `Usuario tiene ${permissions.length} permisos, incluyendo manage:users`;
        }
        
        // Assign roles function
        async function assignRoles() {
            const uid = document.getElementById('userUid').value.trim();
            const reason = document.getElementById('reason').value.trim();
            const resultDiv = document.getElementById('assignmentResult');
            
            if (!uid) {
                resultDiv.innerHTML = `
                    <div class="status error" style="margin-top: 15px;">
                        <span>❌</span>
                        <span>Debes ingresar un UID de usuario</span>
                    </div>
                `;
                log('Error: UID vacío', 'error');
                return;
            }
            
            // Get selected roles
            const selectedRoles = [];
            ['super_admin', 'gerencia', 'responsable', 'editor', 'visualizador'].forEach(role => {
                if (document.getElementById(`role_${role}`).checked) {
                    selectedRoles.push(role);
                }
            });
            
            if (selectedRoles.length === 0) {
                resultDiv.innerHTML = `
                    <div class="status error" style="margin-top: 15px;">
                        <span>❌</span>
                        <span>Debes seleccionar al menos un rol</span>
                    </div>
                `;
                log('Error: No hay roles seleccionados', 'error');
                return;
            }
            
            const token = getAuthToken();
            if (!token) {
                resultDiv.innerHTML = `
                    <div class="status error" style="margin-top: 15px;">
                        <span>❌</span>
                        <span>No hay token de autenticación</span>
                    </div>
                `;
                log('Error: Sin token', 'error');
                return;
            }
            
            log(`Asignando roles ${selectedRoles.join(', ')} al usuario ${uid}...`, 'info');
            
            resultDiv.innerHTML = `
                <div class="status pending" style="margin-top: 15px;">
                    <span class="spinner"></span>
                    <span>Asignando roles...</span>
                </div>
            `;
            
            try {
                const requestBody = {
                    roles: selectedRoles,
                    reason: reason || 'Asignación desde test de roles'
                };
                
                log(`Request body: ${JSON.stringify(requestBody)}`, 'info');
                log(`Authorization header: Bearer ${token.substring(0, 20)}...`, 'info');
                
                const response = await fetch(`/api/proxy/auth/admin/users/${uid}/roles`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(requestBody)
                });
                
                log(`Response status: ${response.status}`, 'info');
                
                const data = await response.json();
                log(`Response data: ${JSON.stringify(data)}`, 'info');
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${data.error || data.message || data.detail || JSON.stringify(data)}`);
                }
                
                resultDiv.innerHTML = `
                    <div class="status success" style="margin-top: 15px;">
                        <span>✅</span>
                        <span>Roles asignados exitosamente</span>
                    </div>
                    <div class="json-viewer">${JSON.stringify(data, null, 2)}</div>
                `;
                
                log(`✅ Roles asignados exitosamente a ${uid}`, 'success');
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status error" style="margin-top: 15px;">
                        <span>❌</span>
                        <span>Error: ${error.message}</span>
                    </div>
                `;
                log(`❌ Error asignando roles: ${error.message}`, 'error');
            }
        }
        
        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            log('Test de asignación de roles iniciado', 'info');
            checkAuthStatus();
        });
    </script>
</body>
</html>
