name: CI/CD Frontend

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Lint, Type Check and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: front

      - name: Run ESLint
        run: npm run lint
        working-directory: front

      - name: Type check
        run: npx tsc --noEmit
        working-directory: front

      - name: Run vitest
        run: npx vitest run
        working-directory: front
        env:
          NEXT_PUBLIC_API_BASE_URL: https://gestorproyectoapi-dev.up.railway.app
          NEXT_PUBLIC_APP_ENV: test

      - name: Build
        run: npm run build
        working-directory: front
        env:
          NEXT_PUBLIC_API_BASE_URL: https://gestorproyectoapi-dev.up.railway.app
          NEXT_PUBLIC_APP_ENV: test

  deploy-dev:
    name: Deploy to Vercel Preview (dev)
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy preview to Vercel
        run: vercel --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: front
        env:
          VERCEL_ORG_ID: team_SzZM9UUotBq10Z80gIsZpAzv
          VERCEL_PROJECT_ID: prj_cgN6j6t6SBf6hAP9IOScdxcwWG9l

  deploy-prod:
    name: Deploy to Vercel Production (master)
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify deployer identity
        run: |
          ALLOWED_USER="Juanpgm"
          if [ "${{ github.actor }}" != "$ALLOWED_USER" ]; then
            echo "ERROR: Only $ALLOWED_USER can deploy to production."
            exit 1
          fi
          echo "Authorized: $ALLOWED_USER"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel Production
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: front
        env:
          VERCEL_ORG_ID: team_SzZM9UUotBq10Z80gIsZpAzv
          VERCEL_PROJECT_ID: prj_cgN6j6t6SBf6hAP9IOScdxcwWG9l